    </script>

                                        <p className="mt-4 text-center text-xs font-medium text-slate-600">Наливаємо воду. Що бачимо?</p>
                                    </div>
                                    <div className="space-y-2">
                                        {[
                                            {id: 'l1', text: 'У всіх колінах встановлюється однаковий рівень.'},
                                            {id: 'l2', text: 'Форма посудин не впливає на висоту стовпа рідини.'}
                                        ].map(obs => (
                                            <button key={obs.id} onClick={() => toggleObservation(obs.id)} className={`w-full p-3 rounded-lg border flex items-center gap-3 text-xs sm:text-sm ${observations.includes(obs.id) ? 'border-green-500 bg-green-50 text-green-700' : 'border-slate-200'}`}>
                                                <div className={`w-4 h-4 border rounded-full ${observations.includes(obs.id) ? 'bg-green-500' : ''}`}></div>
                                                {obs.text}
                                            </button>
                                        ))}
                                    </div>
                                    <button disabled={observations.length < 2} onClick={() => setStep(3)} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold disabled:opacity-50 tracking-wide">Дослідити олію та воду</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="waves" /> 3. Різні рідини
                                    </h2>
                                    <div className="p-4 bg-slate-100 rounded-lg flex flex-col items-center relative overflow-hidden">
                                        <div className="flex gap-16 items-end h-40 border-b-4 border-slate-400 px-10 relative">
                                            {/* Water Column */}
                                            <div className="w-12 bg-blue-500 h-24 rounded-t relative">
                                                <div className="absolute -top-6 left-0 right-0 text-center text-[10px] font-bold">h₁ (вода)</div>
                                            </div>
                                            {/* Oil Column */}
                                            <div className="w-12 bg-yellow-400 h-32 rounded-t relative">
                                                <div className="absolute -top-6 left-0 right-0 text-center text-[10px] font-bold">h₂ (олія)</div>
                                            </div>
                                        </div>
                                        
                                        {!measured ? (
                                            <button onClick={() => setMeasured(true)} className="mt-4 bg-slate-800 text-white px-4 py-2 rounded-lg text-xs flex items-center gap-2 animate-bounce">
                                                <Icon name="ruler" /> Виміряти висоти лінійкою
                                            </button>
                                        ) : (
                                            <div className="mt-4 p-2 bg-white rounded border border-slate-300 text-[11px] font-mono">
                                                Результат: h₂ (олія) > h₁ (вода)
                                            </div>
                                        )}
                                    </div>

                                    {measured && (
                                        <div className="grid grid-cols-1 gap-2">
                                            {[
                                                { id: 'diff', text: 'Висота стовпа рідини з меншою густиною (олії) є більшою.', correct: true },
                                                { id: 'math', text: 'Висоти стовпів рідин обернено пропорційні до їхніх густин.', correct: true }
                                            ].map(item => (
                                                <button key={item.id} onClick={() => setSecondPropertyObs(item)} className={`p-4 rounded-lg border-2 text-left text-xs sm:text-sm transition-all ${secondPropertyObs?.id === item.id ? 'border-blue-500 bg-blue-50' : 'border-slate-100'}`}>
                                                    {item.text}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                    <button disabled={!secondPropertyObs} onClick={() => setStep(4)} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Сформувати звіт</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="pen" /> Лабораторний журнал
                                    </h2>
                                    <div className="p-6 bg-white border-2 border-slate-200 rounded-xl font-serif text-slate-800 text-xs sm:text-sm shadow-inner leading-relaxed">
                                        <p className="mb-2 italic text-slate-500">Висновок за результатами вимірювань:</p>
                                        <ul className="space-y-3">
                                            <li className="flex gap-2">
                                                <span className="font-bold">1.</span>
                                                У сполучених посудинах будь-якої форми поверхні однорідної рідини встановлюються на <strong>однаковому рівні</strong>.
                                            </li>
                                            <li className="flex gap-2">
                                                <span className="font-bold">2.</span>
                                                При наливанні різних рідин висоти стовпів над рівнем поділу <strong>обернено пропорційні</strong> до їхніх густин: 
                                                <div className="text-center my-2 font-bold p-2 bg-slate-50 rounded">h₁/h₂ = ρ₂/ρ₁</div>
                                            </li>
                                        </ul>
                                        <p className="mt-4 text-[10px] text-slate-400 uppercase">Лінійка підтвердила: чим менша густина рідини, тим вищий її стовп.</p>
                                    </div>
                                    <button onClick={handleReset} className="w-full flex items-center justify-center gap-2 bg-slate-100 py-3 rounded-xl text-slate-600 text-xs font-bold hover:bg-slate-200 transition-colors">
                                        <Icon name="refresh" /> Повторити експеримент
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
