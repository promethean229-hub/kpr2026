<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дослідження властивостей сполучених посудин</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Inline Lucide-like Icons for zero dependencies
        const Icon = ({ name }) => {
            const icons = {
                beaker: <path d="M4.5 3h15M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3M6 14h12" />,
                droplets: <path d="M7 16.3c2.2 0 4-1.8 4-4 0-3.3-4.5-8.3-4.5-8.3S2 7.3 2 12.3c0 2.2 1.8 4 4 4zM17.5 21c2.5 0 4.5-2 4.5-4.5 0-3.7-4.5-9-4.5-9s-4.5 5.3-4.5 9c0 2.5 2 4.5 4.5 4.5z" />,
                pen: <path d="M12 19l7-7 3 3-7 7-3-3z M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />,
                check: <polyline points="20 6 9 17 4 12" />,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />,
                book: <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5v-15z" />,
                waves: <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" />,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            };
            return (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [step, setStep] = useState(0);
            const [selectedTools, setSelectedTools] = useState([]);
            const [observations, setObservations] = useState([]);
            const [secondPropertyObs, setSecondPropertyObs] = useState(null);

            const tools = [
                { id: 'vessels', name: 'набір сполучених посудин різної форми', correct: true },
                { id: 'water', name: 'вода (підфарбована)', correct: true },
                { id: 'oil', name: 'олія (рідина іншої густини)', correct: true },
                { id: 'ruler', name: 'лінійка', correct: true },
                { id: 'stopwatch', name: 'секундомір', correct: false },
                { id: 'thermometer', name: 'термометр', correct: false },
                { id: 'rubber_tube', name: 'гумова трубка для з’єднання', correct: true }
            ];

            const observationSteps = [
                { id: 'level', text: 'Рівень однорідної рідини в усіх посудинах однаковий.' },
                { id: 'shape', text: 'Рівень не залежить від форми та площі перерізу посудин.' }
            ];

            const examples = [
                { name: 'Чайник', desc: 'Носик та корпус — це сполучені посудини.' },
                { name: 'Водогін', desc: 'Водонапірна башта вище за будинки.' },
                { name: 'Шлюзи', desc: 'Рівні річок для суден.' },
                { name: 'Криниця', desc: 'Природний тиск води.' }
            ];

            const toggleTool = (tool) => {
                setSelectedTools(prev => prev.includes(tool.id) ? prev.filter(id => id !== tool.id) : [...prev, tool.id]);
            };

            const toggleObservation = (obsId) => {
                setObservations(prev => prev.includes(obsId) ? prev.filter(id => id !== obsId) : [...prev, obsId]);
            };

            const handleReset = () => {
                setStep(0); setSelectedTools([]); setObservations([]); setSecondPropertyObs(null);
            };

            const getGrade = () => {
                const correctToolsCount = selectedTools.filter(id => tools.find(t => t.id === id && t.correct)).length;
                const score = (correctToolsCount * 1.5) + (observations.length * 2) + (secondPropertyObs?.correct ? 3 : 0);
                if (score >= 12) return "Відмінно!";
                if (score >= 8) return "Добре";
                return "Спробуй ще";
            };

            return (
                <div className="min-h-screen bg-slate-50 p-2 sm:p-4 md:p-8 font-sans">
                    <div className="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
                        
                        <div className="bg-blue-700 px-6 py-5 text-white shadow-sm">
                            <h1 className="text-center font-bold text-lg sm:text-xl leading-tight uppercase tracking-wide">
                                Дослідження властивостей сполучених посудин
                            </h1>
                        </div>

                        <div className="flex justify-between px-6 py-4 bg-slate-50 border-b border-slate-100">
                            {[0, 1, 2, 3, 4].map((i) => (
                                <div key={i} className={`h-2.5 w-2.5 rounded-full transition-all duration-300 ${step >= i ? 'bg-blue-600 scale-125' : 'bg-slate-200'}`} />
                            ))}
                        </div>

                        <div className="p-4 sm:p-6">
                            {step === 0 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="book" /> Вступ
                                    </h2>
                                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 text-sm leading-relaxed text-slate-700">
                                        <strong>Сполучені посудини</strong> — це посудини, з'єднані між собою так, що рідина вільно перетікає між ними.
                                    </div>
                                    <div className="grid grid-cols-1 gap-2">
                                        {examples.map(ex => (
                                            <div key={ex.name} className="p-3 border border-slate-100 rounded-lg bg-slate-50 text-sm">
                                                <span className="font-bold text-blue-800">{ex.name}</span> — {ex.desc}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setStep(1)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 active:scale-95 transition-all shadow-md mt-2">
                                        Почати дослідження
                                    </button>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="beaker" /> 1. Обладнання
                                    </h2>
                                    <div className="grid grid-cols-1 gap-2">
                                        {tools.map(tool => (
                                            <button key={tool.id} onClick={() => toggleTool(tool)} className={`p-3.5 rounded-lg border-2 text-left transition-all text-xs sm:text-sm font-medium ${selectedTools.includes(tool.id) ? 'border-blue-500 bg-blue-50 text-blue-800' : 'border-slate-100 bg-white text-slate-700'}`}>
                                                {tool.name}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => setStep(0)} className="flex-1 border border-slate-200 py-3 rounded-xl text-sm font-semibold text-slate-500">Назад</button>
                                        <button disabled={selectedTools.length < 3} onClick={() => setStep(2)} className="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold disabled:opacity-50">Далі</button>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="droplets" /> 2. Одна рідина
                                    </h2>
                                    <div className="p-3 bg-blue-50 rounded-lg text-xs text-blue-800">Наливаємо <strong>підфарбовану воду</strong>. Що бачимо?</div>
                                    <div className="space-y-2">
                                        {observationSteps.map(obs => (
                                            <button key={obs.id} onClick={() => toggleObservation(obs.id)} className={`w-full p-4 rounded-lg border-2 text-left flex items-center gap-3 transition-all ${observations.includes(obs.id) ? 'border-green-500 bg-green-50 shadow-sm' : 'border-slate-100 bg-white'}`}>
                                                <div className={`h-5 w-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center ${observations.includes(obs.id) ? 'bg-green-500 border-green-500' : 'border-slate-200'}`}>
                                                    {observations.includes(obs.id) && <Icon name="check" />}
                                                </div>
                                                <span className="text-xs sm:text-sm text-slate-700">{obs.text}</span>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => setStep(1)} className="flex-1 border border-slate-200 py-3 rounded-xl text-sm font-semibold text-slate-500">Назад</button>
                                        <button disabled={observations.length === 0} onClick={() => setStep(3)} className="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold">Далі</button>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="waves" /> 3. Різні рідини
                                    </h2>
                                    <div className="p-3 bg-orange-50 rounded-lg text-xs text-orange-800">В одному коліні — вода, в іншому — олія. Результат:</div>
                                    <div className="grid grid-cols-1 gap-2">
                                        {[
                                            { id: 'diff', text: 'Висота стовпа олії більша за висоту води, бо олія має меншу густину.', correct: true },
                                            { id: 'same', text: 'Висоти обох рідин однакові.', correct: false },
                                            { id: 'less', text: 'Стовп олії нижчий за стовп води.', correct: false }
                                        ].map(item => (
                                            <button key={item.id} onClick={() => setSecondPropertyObs(item)} className={`p-4 rounded-lg border-2 text-left text-xs sm:text-sm transition-all ${secondPropertyObs?.id === item.id ? (item.correct ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50') : 'border-slate-100 bg-white'}`}>
                                                {item.text}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => setStep(2)} className="flex-1 border border-slate-200 py-3 rounded-xl text-sm font-semibold text-slate-500">Назад</button>
                                        <button disabled={!secondPropertyObs} onClick={() => setStep(4)} className="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold">Готово</button>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-4 animate-in">
                                    <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 uppercase text-sm tracking-wider">
                                        <Icon name="pen" /> Твій звіт
                                    </h2>
                                    <div className="p-5 bg-white border border-slate-200 rounded-xl font-serif text-slate-800 text-xs sm:text-sm leading-relaxed shadow-inner">
                                        <h3 className="text-center font-bold mb-4 underline uppercase text-blue-900">Властивості сполучених посудин</h3>
                                        <p className="mb-2"><strong>Обладнання:</strong> {selectedTools.map(id => tools.find(t => t.id === id).name).join(', ')}.</p>
                                        <p className="font-bold italic mb-1 uppercase text-[10px]">Дослідження:</p>
                                        <ol className="list-decimal ml-4 mb-4 space-y-2">
                                            <li>З водою: {observations.length > 0 ? observations.map(id => observationSteps.find(o => o.id === id).text.toLowerCase()).join(' ') : '...'}</li>
                                            <li>З олією: {secondPropertyObs?.correct ? 'висота стовпа олії більша за висоту води.' : '...'}</li>
                                        </ol>
                                        <div className="border-t pt-3">
                                            <p className="font-bold">Висновок:</p>
                                            <p>1. Однорідна рідина — рівні однакові.</p>
                                            <p>2. Різні рідини — менша густина = більша висота.</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-between pt-2">
                                        <div className="text-blue-700 font-bold text-sm">Оцінка: {getGrade()}</div>
                                        <button onClick={handleReset} className="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg text-slate-600 text-xs font-bold">
                                            <Icon name="refresh" /> Спочатку
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="max-w-xl mx-auto mt-4 text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                        Фізика 7 клас • Інтерактивний модуль
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
