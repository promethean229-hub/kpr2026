<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Властивості сполучених посудин - Фізика 229</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Cambria Math';
            src: local('Cambria Math'), local('Cambria'), serif;
        }
        body {
            font-family: 'Cambria Math', 'Cambria', serif !important;
            -webkit-tap-highlight-color: transparent;
        }
        .math-font {
            font-family: 'Cambria Math', 'Cambria', serif !important;
            font-style: normal !important;
        }
        select {
            font-family: 'Cambria Math', 'Cambria', serif !important;
        }
        /* Анімація появи */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Beaker: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>,
            Droplets: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 16.3c2.2 0 4-1.8 4-4 0-3.3-4-6.3-4-6.3s-4 3-4 6.3c0 2.2 1.8 4 4 4Z"/><path d="M17 18.3c1.7 0 3-1.3 3-3 0-2.5-3-4.8-3-4.8s-3 2.3-3 4.8c0 1.7 1.3 3 3 3Z"/></svg>,
            Ruler: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z"/><path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/><path d="m4.5 13.5 2 2"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        };

        const App = () => {
            const [screen, setScreen] = useState('start');
            const [selectedEquip, setSelectedEquip] = useState([]);
            const [feedback, setFeedback] = useState(null);
            const [summaryChoices, setSummaryChoices] = useState({
                tools: '',
                level: '',
                relation: '',
                formula: ''
            });

            const checkEquip = () => {
                const correct = ['u_tube', 'water', 'oil', 'ruler'];
                const hasAllCorrect = correct.every(id => selectedEquip.includes(id));
                const hasNoIncorrect = selectedEquip.every(id => correct.includes(id));

                if (hasAllCorrect && hasNoIncorrect) {
                    setFeedback({ type: 'success', text: 'Правильно! Обладнання підібрано вірно.' });
                    setTimeout(() => { setScreen('homogeneous'); setFeedback(null); }, 1500);
                } else {
                    setFeedback({ type: 'error', text: 'Помилка. Виберіть лише 4 необхідні інструменти.' });
                }
            };

            const CustomSelect = ({ id, options, correctValue, placeholder }) => {
                const isCorrect = summaryChoices[id] === correctValue;
                const isSelected = summaryChoices[id] !== '';

                return (
                    <div className="inline-block relative min-w-[110px] mx-1 align-middle">
                        <select
                            value={summaryChoices[id]}
                            onChange={(e) => setSummaryChoices({ ...summaryChoices, [id]: e.target.value })}
                            className={`appearance-none w-full bg-white border-2 rounded-lg px-2 py-1 pr-6 text-xs font-bold transition-all focus:outline-none ${
                                !isSelected ? 'border-blue-200 text-blue-600' : isCorrect ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-400 bg-red-50 text-red-700'
                            }`}
                        >
                            <option value="" disabled>{placeholder}</option>
                            {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                        </select>
                    </div>
                );
            };

            const ScreenWrapper = ({ title, children }) => (
                <div className="flex flex-col min-h-screen max-w-md mx-auto bg-slate-50 shadow-2xl border-x border-slate-200">
                    <header className="bg-blue-800 text-white p-5 text-center shadow-md">
                        <h1 className="text-xl font-bold tracking-tight uppercase">Властивості сполучених посудин</h1>
                    </header>

                    <main className="flex-grow p-4 overflow-y-auto pb-20">
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 fade-in">
                            <div className="text-blue-600 font-bold uppercase text-[10px] tracking-widest mb-4 flex items-center gap-2">
                                <span className="w-2 h-2 bg-blue-600 rounded-full animate-pulse"></span>
                                {title}
                            </div>
                            {children}
                            
                            {feedback && (
                                <div className={`mt-6 p-4 rounded-2xl flex items-center gap-3 animate-bounce ${feedback.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                    {feedback.type === 'success' ? <Icons.Check /> : <Icons.Alert />}
                                    <span className="text-xs font-bold">{feedback.text}</span>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="bg-slate-900 text-slate-400 p-4 text-center text-[10px] font-bold uppercase tracking-widest">
                        2026 Онлайн-кабінет фізики 229
                    </footer>
                </div>
            );

            if (screen === 'start') {
                return (
                    <ScreenWrapper title="Вступ">
                        <h2 className="text-2xl font-bold mb-4 text-slate-800">Підготовка до відповіді</h2>
                        <p className="text-slate-600 mb-8 leading-relaxed text-sm">
                            Цей тренажер допоможе вам підготувати письмовий опис досліду. Ви пройдете через вибір обладнання, аналіз результатів та заповните підсумковий конспект.
                        </p>
                        <button onClick={() => setScreen('equip')} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl font-bold shadow-lg active:scale-95 transition-all text-lg">
                            Розпочати вправу
                        </button>
                    </ScreenWrapper>
                );
            }

            if (screen === 'equip') {
                const items = [
                    { id: 'u_tube', text: 'U-подібна трубка', icon: <Icons.Beaker /> },
                    { id: 'water', text: 'Вода (ρ = 1000 кг/м³)', icon: <Icons.Droplets /> },
                    { id: 'oil', text: 'Олія (ρ = 900 кг/м³)', icon: <Icons.Droplets /> },
                    { id: 'ruler', text: 'Лінійка', icon: <Icons.Ruler /> },
                    { id: 'term', text: 'Термометр', icon: <Icons.Alert /> },
                    { id: 'dynamo', text: 'Динамометр', icon: <Icons.Alert /> },
                ];
                return (
                    <ScreenWrapper title="Крок 1: Обладнання">
                        <p className="text-xs text-slate-500 mb-4 italic">Оберіть лише ті 4 інструменти, що потрібні для демонстрації властивостей сполучених посудин:</p>
                        <div className="grid grid-cols-1 gap-2">
                            {items.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setSelectedEquip(prev => prev.includes(item.id) ? prev.filter(i => i !== item.id) : [...prev, item.id])}
                                    className={`flex items-center gap-4 p-4 border-2 rounded-2xl transition-all text-left ${selectedEquip.includes(item.id) ? 'border-blue-600 bg-blue-50 shadow-inner' : 'border-slate-100 bg-slate-50'}`}
                                >
                                    <span className={selectedEquip.includes(item.id) ? 'text-blue-600' : 'text-slate-400'}>{item.icon}</span>
                                    <span className="text-xs font-bold">{item.text}</span>
                                </button>
                            ))}
                        </div>
                        <button onClick={checkEquip} className="w-full mt-8 bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">
                            Перевірити набір
                        </button>
                    </ScreenWrapper>
                );
            }

            if (screen === 'homogeneous' || screen === 'heterogeneous') {
                const isHom = screen === 'homogeneous';
                return (
                    <ScreenWrapper title={isHom ? "Дослід №1" : "Дослід №2"}>
                        <div className={`p-5 rounded-2xl mb-6 border-2 ${isHom ? 'bg-blue-50 border-blue-100' : 'bg-amber-50 border-amber-100'}`}>
                            <p className="text-[10px] font-black uppercase mb-2 text-slate-500">{isHom ? 'Однорідна рідина (вода):' : 'Неоднорідні рідини (вода + олія):'}</p>
                            <p className="text-sm text-slate-800 leading-relaxed font-bold">
                                {isHom ? 'Наливаємо воду в U-подібну трубку. Як встановляться вільні поверхні?' : 'Доливаємо олію в одне з колін. Як зміняться рівні відносно межі поділу?'}
                            </p>
                        </div>
                        <div className="space-y-3">
                            {(isHom ? [
                                { id: 1, text: 'На одному рівні (h₁ = h₂)', correct: true },
                                { id: 2, text: 'У вужчій трубці вище', correct: false },
                            ] : [
                                { id: 1, text: 'Рівень олії буде вищим (ρ менша)', correct: true },
                                { id: 2, text: 'Рівні будуть однаковими', correct: false },
                            ]).map(opt => (
                                <button
                                    key={opt.id}
                                    onClick={() => {
                                        if (opt.correct) {
                                            setFeedback({ type: 'success', text: 'Вірно!' });
                                            setTimeout(() => { setScreen(isHom ? 'heterogeneous' : 'result'); setFeedback(null); }, 1000);
                                        } else {
                                            setFeedback({ type: 'error', text: 'Помилка. Подумайте про залежність тиску від висоти.' });
                                        }
                                    }}
                                    className="w-full p-5 text-left border-2 border-slate-200 rounded-2xl text-xs font-bold hover:border-blue-400 hover:bg-white transition-all shadow-sm"
                                >
                                    {opt.text}
                                </button>
                            ))}
                        </div>
                    </ScreenWrapper>
                );
            }

            const allCorrect = 
                summaryChoices.tools === 'трубка' && 
                summaryChoices.level === 'однаковому' && 
                summaryChoices.relation === 'менша' && 
                summaryChoices.formula === 'h1/h2 = ρ2/ρ1';

            return (
                <ScreenWrapper title="Підсумковий конспект">
                    <div className="space-y-6">
                        <div className="text-center bg-slate-900 text-white p-4 rounded-2xl shadow-md">
                            <h2 className="text-lg font-bold">Ваша письмова відповідь</h2>
                            <p className="text-[10px] opacity-70 italic">Заповніть пропуски для завершення</p>
                        </div>

                        <div className="bg-white border-2 border-slate-100 p-4 rounded-2xl text-xs leading-loose text-slate-800 shadow-sm">
                            <p className="math-font mb-4">
                                <span className="font-bold text-blue-800">1. Обладнання:</span> Для демонстрації потрібна скляна U-подібна 
                                <CustomSelect 
                                    id="tools" 
                                    options={['трубка', 'колба', 'мензурка']} 
                                    correctValue="трубка" 
                                    placeholder="оберіть..." 
                                />, лінійка, вода та олія.
                            </p>

                            <p className="math-font mb-4">
                                <span className="font-bold text-blue-800">2. Однорідна рідина:</span> У сполучених посудинах вільні поверхні води встановлюються на 
                                <CustomSelect 
                                    id="level" 
                                    options={['однаковому', 'різному']} 
                                    correctValue="однаковому" 
                                    placeholder="рівні..." 
                                /> горизонтальному рівні.
                            </p>

                            <p className="math-font mb-4">
                                <span className="font-bold text-blue-800">3. Різні рідини:</span> При рівновазі висота стовпа буде 
                                <CustomSelect 
                                    id="relation" 
                                    options={['більша', 'менша']} 
                                    correctValue="менша" 
                                    placeholder="висота..." 
                                /> у тієї рідини, густина якої є більшою.
                            </p>

                            <div className="mt-6 flex flex-col items-center p-4 bg-blue-50 rounded-xl border border-blue-200">
                                <p className="mb-2 font-bold text-blue-900">Математична умова:</p>
                                <CustomSelect 
                                    id="formula" 
                                    options={['h1/h2 = ρ2/ρ1', 'h1/h2 = ρ1/ρ2', 'h1*h2 = ρ1*ρ2']} 
                                    correctValue="h1/h2 = ρ2/ρ1" 
                                    placeholder="оберіть формулу..." 
                                />
                            </div>
                        </div>

                        {allCorrect && (
                            <div className="fade-in bg-green-500 text-white p-6 rounded-3xl text-center shadow-xl border-4 border-green-200">
                                <div className="flex justify-center mb-2"><Icons.Check /></div>
                                <p className="font-bold text-sm uppercase">Конспект готовий!</p>
                                <p className="text-[10px] mt-2 opacity-90 leading-tight">Ви успішно підготувалися до письмової відповіді на запитання вчителя.</p>
                            </div>
                        )}

                        <button onClick={() => window.location.reload()} className="w-full flex items-center justify-center gap-2 text-slate-400 font-bold text-[10px] uppercase py-4 mt-4 border-2 border-slate-200 rounded-2xl hover:bg-slate-100 transition-colors">
                            <Icons.Refresh /> Почати спочатку
                        </button>
                    </div>
                </ScreenWrapper>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
