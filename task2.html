<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демонстрація закону Паскаля: Конструктор</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .water-drop {
            position: absolute;
            width: 4px;
            height: 12px;
            background: #60a5fa;
            border-radius: 2px;
            opacity: 0;
            z-index: 50;
        }
        .spraying .water-drop {
            animation: spray-out 0.6s linear infinite;
        }
        @keyframes spray-out {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0.5); opacity: 0; }
        }
        .pressure-wave {
            animation: pulse 1s ease-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .paper-texture {
            background-color: #fff;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Icon = ({ name }) => {
            const icons = {
                wrench: <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.77 3.77z" />,
                beaker: <path d="M7 2v20M17 2v20M7 12h10M7 2h10" />,
                check: <path d="M20 6L9 17l-5-5" />,
                book: <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5A2.5 2.5 0 0 1 6.5 2.5H20" />,
                pen: <path d="M12 19l7-7 3 3-7 7-3-3z M18 13l-1.5-1.5 M2 20h5M9 2l1.22 1.22" />,
                alert: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </React.Fragment>
                )
            };
            return (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [step, setStep] = useState(0); 
            const [selectedItems, setSelectedItems] = useState([]);
            const [isSpraying, setIsSpraying] = useState(false);
            const [sprayCount, setSprayCount] = useState(0);
            const [answers, setAnswers] = useState({ q1: '', q2: '' });

            const components = [
                { id: 'ball', name: 'М’ячик для настільного тенісу', required: true },
                { id: 'sponge', name: 'Кухонна губка', required: false },
                { id: 'syringe', name: 'Медичний шприц (20 мл)', required: true },
                { id: 'needle', name: 'Товста голка або шило', required: true },
                { id: 'magnet', name: 'Потужний магніт', required: false },
                { id: 'glue', name: 'Клей-пістолет / Пластилін', required: true }
            ];

            const toggleItem = (id) => {
                setSelectedItems(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const checkSelection = () => {
                const requiredIds = components.filter(c => c.required).map(c => c.id);
                const selectedRequired = selectedItems.filter(id => requiredIds.includes(id));
                const selectedWrong = selectedItems.filter(id => !requiredIds.includes(id));
                return selectedRequired.length === requiredIds.length && selectedWrong.length === 0;
            };

            const handleSpray = () => {
                setIsSpraying(true);
                setSprayCount(prev => prev + 1);
            };

            const isReportComplete = answers.q1.toLowerCase().includes('однаково') && 
                                    (answers.q2.toLowerCase().includes('паскал') || answers.q2.toLowerCase().includes('усіх'));

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                        
                        <div className="bg-slate-900 p-6 text-white text-center">
                            <h1 className="text-xl font-bold uppercase tracking-tight">Куля Паскаля своїми руками</h1>
                            <p className="text-slate-400 text-xs mt-1 italic">Експериментальна установка</p>
                        </div>

                        <div className="p-6">
                            {/* STEP 0: SELECTION */}
                            {step === 0 && (
                                <div className="space-y-6 animate-in">
                                    <div className="flex items-center gap-3 text-emerald-700">
                                        <Icon name="wrench" />
                                        <h2 className="font-bold uppercase text-sm tracking-wide">Крок 1: Підготовка</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {components.map(item => (
                                            <button 
                                                key={item.id}
                                                onClick={() => toggleItem(item.id)}
                                                className={`flex items-start gap-3 p-4 rounded-xl border-2 transition-all ${selectedItems.includes(item.id) ? 'border-blue-500 bg-blue-50' : 'border-slate-100 bg-white'}`}
                                            >
                                                <div className={`mt-1 h-5 w-5 rounded border-2 flex items-center justify-center ${selectedItems.includes(item.id) ? 'bg-blue-500 border-blue-500' : 'border-slate-300'}`}>
                                                    {selectedItems.includes(item.id) && <Icon name="check" />}
                                                </div>
                                                <div className="text-left font-bold text-sm text-slate-800">{item.name}</div>
                                            </button>
                                        ))}
                                    </div>
                                    <button 
                                        disabled={!checkSelection()}
                                        onClick={() => setStep(1)}
                                        className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold disabled:opacity-20 shadow-lg"
                                    >
                                        Зібрати установку
                                    </button>
                                </div>
                            )}

                            {/* STEP 1: EXPERIMENT */}
                            {step === 1 && (
                                <div className="space-y-6 animate-in">
                                    <div className="flex items-center gap-3 text-blue-700">
                                        <Icon name="beaker" />
                                        <h2 className="font-bold uppercase text-sm tracking-wide">Крок 2: Дослідження</h2>
                                    </div>

                                    <div className="relative h-[400px] bg-slate-50 rounded-3xl border-2 border-slate-200 flex flex-col items-center justify-center overflow-hidden">
                                        
                                        <div className="relative z-20 flex flex-col items-center translate-y-4">
                                            <div className="w-8 h-12 bg-slate-300 rounded-t-md transition-transform duration-300" 
                                                 style={{ transform: isSpraying ? 'translateY(25px)' : 'translateY(0)' }}>
                                                <div className="w-10 h-2 bg-slate-400 -ml-1 mt-0 rounded-full"></div>
                                            </div>
                                            <div className="w-12 h-28 bg-blue-100/40 border-x-2 border-blue-300 relative">
                                                <div className="absolute inset-x-0 bottom-0 bg-blue-400/30 transition-all duration-300" 
                                                     style={{ height: isSpraying ? '20%' : '70%' }}></div>
                                            </div>
                                            <div className="w-3 h-4 bg-slate-400"></div>
                                        </div>

                                        <div className="w-24 h-24 bg-orange-200 rounded-full border-4 border-orange-300 shadow-lg relative flex items-center justify-center z-10 -mt-1">
                                            {isSpraying && <div className="absolute inset-0 bg-blue-400/20 rounded-full pressure-wave"></div>}
                                            <div className="text-[9px] font-black text-orange-500 uppercase opacity-60 text-center select-none">М'яч</div>
                                            
                                            <div className={`absolute inset-0 ${isSpraying ? 'spraying' : 'hidden'}`}>
                                                {[0, 45, 90, 135, 180, 225, 270, 315].map(deg => (
                                                    <div key={deg} className="water-drop" style={{
                                                            top: '50%', left: '50%',
                                                            transform: `translate(-50%, -50%) rotate(${deg}deg)`,
                                                            '--tw-translate-x': `${Math.cos(deg * Math.PI / 180) * 110}px`,
                                                            '--tw-translate-y': `${Math.sin(deg * Math.PI / 180) * 110}px`
                                                        }}></div>
                                                ))}
                                            </div>
                                        </div>

                                        <button 
                                            onMouseDown={handleSpray}
                                            onMouseUp={() => setIsSpraying(false)}
                                            onTouchStart={handleSpray}
                                            onTouchEnd={() => setIsSpraying(false)}
                                            className="mt-12 bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold shadow-xl active:scale-95 select-none"
                                        >
                                            НАТИСНУТИ НА ПОРШЕНЬ
                                        </button>
                                    </div>

                                    {sprayCount > 0 && (
                                        <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 animate-in text-center">
                                            <p className="text-xs text-emerald-800 font-medium mb-3">
                                                Експеримент завершено. Ви побачили, як вода витікає в усіх напрямках.
                                            </p>
                                            <button onClick={() => setStep(2)} className="w-full bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold uppercase tracking-wider">
                                                Заповнити звіт
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* STEP 2: REPORT / WHAT TO WRITE */}
                            {step === 2 && (
                                <div className="space-y-6 animate-in">
                                    <div className="flex items-center gap-3 text-slate-800">
                                        <Icon name="book" />
                                        <h2 className="font-bold uppercase text-sm tracking-wide">Лабораторний журнал</h2>
                                    </div>
                                    
                                    <div className="paper-texture border-2 border-slate-200 p-8 rounded-lg shadow-inner space-y-6 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-16 h-16 bg-blue-500/5 -rotate-45 translate-x-8 -translate-y-8"></div>
                                        
                                        <div className="text-center border-b-2 border-slate-100 pb-4 mb-4">
                                            <h3 className="font-serif font-bold text-slate-800">Звіт з дослідження</h3>
                                            <p className="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Тема: Передача тиску рідинами</p>
                                        </div>

                                        <div className="font-serif text-sm leading-relaxed text-slate-700 space-y-6">
                                            <div>
                                                <p className="mb-2"><strong>1. Спостереження:</strong></p>
                                                <p>
                                                    При натисканні на поршень шприца вода почала витікати з усіх отворів тенісного м'ячика 
                                                    <input 
                                                        type="text" 
                                                        className="mx-1 border-b border-slate-400 bg-transparent px-1 focus:outline-none focus:border-blue-500 text-blue-600 font-bold"
                                                        placeholder="..."
                                                        value={answers.q1}
                                                        onChange={(e) => setAnswers({...answers, q1: e.target.value})}
                                                    /> 
                                                    (однаково/по різному).
                                                </p>
                                            </div>

                                            <div>
                                                <p className="mb-2"><strong>2. Висновок:</strong></p>
                                                <p>
                                                    Дослід підтвердив закон 
                                                    <input 
                                                        type="text" 
                                                        className="mx-1 border-b border-slate-400 bg-transparent px-1 focus:outline-none focus:border-blue-500 text-blue-600 font-bold"
                                                        placeholder="чиє ім'я?"
                                                        value={answers.q2}
                                                        onChange={(e) => setAnswers({...answers, q2: e.target.value})}
                                                    />, 
                                                    який стверджує, що тиск у рідинах передається без змін у 
                                                    <span className="italic underline ml-1">усіх напрямках</span>.
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <div className="text-[10px] text-slate-400 text-center italic">
                                            * Запишіть цей текст у свій робочий зошит після перевірки.
                                        </div>
                                        <button 
                                            onClick={() => setStep(0)} 
                                            className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg active:scale-95"
                                        >
                                            Завершити та вийти
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
